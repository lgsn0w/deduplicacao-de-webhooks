services:
  postgres:
    image: postgres:17.5-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: harness
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness"]
      interval: 2s
      timeout: 5s
      retries: 5

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/consumer"]
    ports:
      - "8082:8082"
    restart: on-failure
    environment:
      DATABASE_URL: "postgres://harness:harness@postgres:5432/harness?sslmode=disable"
      STRATEGY: "${STRATEGY:-none}"
    depends_on:
      postgres:
        condition: service_healthy
